services:

  # ─── Entrada única (porta 80) ───────────────────────────────────────────────
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - nginx
    networks:
      - app
    restart: unless-stopped

  # ─── Frontend Angular (build a partir do repo irmão) ────────────────────────
  frontend:
    image: ghcr.io/alexandrendev/aritmetic-game-fe:sha-164c9b4
    networks:
      - app
    restart: unless-stopped

  # ─── Backend PHP-FPM ────────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www/html
    env_file:
      - .env.prod
    depends_on:
      - minio
    networks:
      - app
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./app:/var/www/html
    env_file:
      - .env.prod
    depends_on:
      - minio
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    networks:
      - app
    restart: unless-stopped

  # ─── Nginx do backend (PHP-FPM) — não exposto publicamente ──────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app
    restart: unless-stopped

  # ─── MinIO (storage de avatars) ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.prod
    ports:
      - "9000:9000"   # acesso público aos arquivos (browser)
      - "9001:9001"   # console admin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set public local/$${MINIO_BUCKET} &&
      echo 'MinIO bucket ready.'
      "
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  minio_data:
